location Beispielort, DEU
name EigenerCaster
url http://ntrip.example.de
rp_email admin@example.de
operator Eigenbetrieb
operator_url http://ntrip.example.de

max_clients 1000
max_clients_per_source 1000
max_sources 40
max_admins 2
throttle 2000.0
max_ip_connections 1000

# Passwoerter -- VOR Produktivbetrieb unbedingt aendern!
encoder_password letmein
admin_password CHANGE_ME_ADMIN
oper_password CHANGE_ME_OPER

server_name ntripcaster
port 80
port 2101

# --- Relay pull: Trimble BD982 liefert rohes RTCM3 per TCP, kein NTRIP-Push.
# Der Caster holt die Stroeme aktiv ab (siehe Konzept Kap. 3.2 / 8).
# BD982 ist unter 192.168.0.10 erreichbar.
relay pull -m /RTCM    192.168.0.10:28001
relay pull -m /RTCM32  192.168.0.10:28002

sourcetablefile sourcetable.dat

logfilename ntripcaster
usagefilename usage
accessfilename access
logdir /usr/local/ntripcaster/logs
logfiledebuglevel 0
watchfilename /usr/local/ntripcaster/var/watchdog.check
pidfilename /usr/local/ntripcaster/var/caster.pid

templatedir /usr/local/ntripcaster/templates

# 2 = log window on stdout -> wird von "docker logs" erfasst
console_mode 2

reverse_lookups 0
acl_policy 1

sourcetable_via_udp 0
