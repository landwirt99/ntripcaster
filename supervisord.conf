[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:caster]
command=/usr/local/ntripcaster/sbin/ntripdaemon -d /usr/local/ntripcaster/conf
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gga-proxy]
command=python3 /app/gga-proxy/proxy.py
autorestart=true
priority=20
environment=CASTER_HOST="127.0.0.1",CASTER_PORT="2101",BACKEND_URL="http://127.0.0.1:8000",LISTEN_PORT="5000"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=uvicorn app:app --host 0.0.0.0 --port 8000
directory=/app
autorestart=true
priority=20
environment=CASTER_URL="http://127.0.0.1:80",CASTER_ADMIN_USER="admin",CASTER_ADMIN_PASS="%(ENV_CASTER_ADMIN_PASS)s",ADMIN_TOKEN="%(ENV_ADMIN_TOKEN)s",PUBLIC_HOSTNAME="%(ENV_PUBLIC_HOSTNAME)s",PUBLIC_NTRIP_PORT="%(ENV_PUBLIC_NTRIP_PORT)s",TRIMBLE_HOST="%(ENV_TRIMBLE_HOST)s",TRIMBLE_PORTS="%(ENV_TRIMBLE_PORTS)s",BASE_LAT="%(ENV_BASE_LAT)s",BASE_LON="%(ENV_BASE_LON)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
